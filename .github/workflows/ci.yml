name: SiteSync CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitesync-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run application tests
        run: npm test
      - name: Run storage tests
        run: npm run test:storage
      - name: Type-check
        run: npm run typecheck
      - name: Build production Worker
        run: npm run build
      - name: Upload build output for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sitesync-production-build
          path: |
            dist/server/wrangler.json
            dist/**
          if-no-files-found: error
          retention-days: 7
